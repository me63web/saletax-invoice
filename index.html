<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIWI · Advance Tax Invoice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: white;
            padding: 2.5rem 3rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .login-box h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #0b2b3f;
        }

        .login-box .subtitle {
            color: #6e879b;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .login-box .form-group {
            margin-bottom: 1.2rem;
        }

        .login-box .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #4f6b7d;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #d5dfe8;
            border-radius: 12px;
            font-size: 0.95rem;
            background: white;
            outline: none;
        }

        .login-box .form-group input:focus {
            border-color: #0b2b3f;
            box-shadow: 0 0 0 3px rgba(11,43,63,0.08);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #0b2b3f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 0.5rem;
        }

        .login-box .login-btn:hover { background: #1a4058; }
        .login-box .login-btn-user { background: #0f7b3e; }
        .login-box .login-btn-user:hover { background: #129446; }

        .login-box .login-error {
            color: #b91c1c;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
            min-height: 1.5rem;
        }

        .login-box .login-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .login-box .login-options {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .login-box .login-options .login-btn { flex: 1; text-align: center; }

        .container {
            max-width: 1440px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 1.5rem 1.5rem 2.5rem;
        }

        .container.hidden { display: none; }

        .report-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9eef3;
            padding-bottom: 1.25rem;
            margin-bottom: 1.75rem;
            gap: 1rem 0.5rem;
        }

        .report-header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b2b3f;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
        }

        .month-badge {
            background: #e2eaf1;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a3b4f;
        }

        .btn {
            background: white;
            border: 1px solid #d0dce8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f3e52;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary { background: #0b2b3f; border-color: #0b2b3f; color: white; }
        .btn-primary:hover { background: #1a4058; }
        .btn-success { background: #0f7b3e; border-color: #0f7b3e; color: white; }
        .btn-success:hover { background: #129446; }
        .btn-danger { background: #b91c1c; border-color: #b91c1c; color: white; }
        .btn-danger:hover { background: #dc2626; }
        
        .btn-danger-small {
            background: #dc2626;
            border: none;
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-danger-small:hover { background: #b91c1c; }
        .btn-danger-small.disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.6; }
        .btn-danger-small.disabled:hover { background: #9ca3af; }

        .add-form {
            background: #f8fafc;
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            border: 1px solid #e2eaf1;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 0.8rem 1rem;
        }

        .add-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1 1 130px;
        }

        .add-form .form-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #4f6b7d;
            font-weight: 600;
        }

        .add-form .form-group input {
            padding: 0.5rem 0.7rem;
            border: 1px solid #d5dfe8;
            border-radius: 10px;
            font-size: 0.85rem;
            background: white;
            outline: none;
        }

        .add-form .form-group input:focus { border-color: #0b2b3f; box-shadow: 0 0 0 3px rgba(11,43,63,0.08); }
        .add-form .form-group input.readonly-field { background: #f3f4f6; color: #4b5563; cursor: not-allowed; opacity: 0.8; }

        .add-form .form-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding-bottom: 0.1rem;
        }

        .auto-hint { font-size: 0.65rem; color: #0f7b3e; font-weight: 500; margin-top: 0.1rem; min-height: 1.2rem; }

        .date-filter-section, .search-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.5rem;
            background: #f8fafc;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            border: 1px solid #e2eaf1;
        }

        .date-filter-section label, .search-section label {
            font-weight: 500;
            color: #1f3e52;
            font-size: 0.85rem;
        }

        .date-filter-section input[type="date"] {
            padding: 0.5rem 0.7rem;
            border: 1px solid #d5dfe8;
            border-radius: 10px;
            font-size: 0.85rem;
            background: white;
            outline: none;
        }

        .date-filter-section .date-range-sep { color: #6e879b; font-weight: 500; }

        .date-filter-section .btn-filter, .search-input-wrapper button {
            background: #0b2b3f;
            border: none;
            color: white;
            padding: 0.45rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .date-filter-section .btn-clear-date, .search-clear {
            background: transparent;
            border: none;
            color: #6e879b;
            font-size: 0.8rem;
            padding: 0 0.6rem;
            cursor: pointer;
            font-weight: 500;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 1px solid #d5dfe8;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            flex: 1 1 260px;
        }

        .search-input-wrapper:focus-within { border-color: #0b2b3f; box-shadow: 0 0 0 3px rgba(11,43,63,0.08); }
        
        .search-input-wrapper input {
            border: none;
            padding: 0.55rem 0;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            background: transparent;
            color: #1a2e3d;
        }

        .search-input-wrapper input::placeholder { color: #9aafbe; }
        .result-count { font-size: 0.85rem; color: #2f4d64; font-weight: 450; margin-left: 0.2rem; }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            background: #f8fafc;
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            border: 1px solid #e2eaf1;
        }

        .summary-item { display: flex; flex-direction: column; }
        .summary-item .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #4f6b7d; font-weight: 600; }
        .summary-item .value { font-size: 1.5rem; font-weight: 700; color: #0b2b3f; margin-top: 0.2rem; }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid #e9edf2;
            background: white;
            margin-top: 0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 900px;
        }

        th {
            background: #f2f6fa;
            color: #1f3e52;
            font-weight: 600;
            padding: 0.9rem 0.8rem;
            text-align: left;
            border-bottom: 2px solid #dbe1e8;
            white-space: nowrap;
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
            color: #1f2e3b;
        }

        tr:last-child td { border-bottom: none; }
        .party-name { font-weight: 500; color: #0b2b3f; white-space: nowrap; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .empty-row td { color: #8f9fad; font-style: italic; padding: 1.5rem 0.8rem; text-align: center; }
        .delete-cell { text-align: center; white-space: nowrap; }

        .logout-btn {
            background: transparent;
            border: 1px solid #d0dce8;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1f3e52;
            cursor: pointer;
        }

        .logout-btn:hover { background: #f2f6fb; }

        .user-role-badge { font-size: 0.75rem; padding: 0.3rem 1rem; border-radius: 60px; background: #0b2b3f; color: white; font-weight: 500; }
        .user-role-badge.user { background: #0f7b3e; }

        .user-restriction-notice {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #92400e;
            display: none;
        }

        .user-restriction-notice.visible { display: block; }

        .footer-note {
            margin-top: 1.5rem;
            padding: 0.8rem 1rem 0.2rem;
            font-size: 0.8rem;
            color: #577184;
            border-top: 1px dashed #d5dfe8;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .file-sync-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #0f7b3e;
            background: #e6f7ed;
            border: 1px solid #0f7b3e;
            border-radius: 12px;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .file-sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0f7b3e;
            flex-shrink: 0;
        }

        .footer-credits {
            margin-top: 0.4rem;
            padding: 0 1rem;
            font-size: 0.75rem;
            color: #8a9bab;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
        }

        @media print {
            body { background: white; padding: 0.5rem; }
            .container { box-shadow: none; border: 1px solid #ccc; border-radius: 12px; }
            .btn, .search-section, .header-actions .btn, .add-form, .delete-cell, .date-filter-section, .file-sync-status { display: none !important; }
            .report-header { border-bottom-color: #aaa; }
            .summary-cards { background: #f5f7fa; border-color: #ccc; }
            .table-wrapper { border-color: #aaa; }
            th { background: #e9edf2 !important; }
            .footer-note { border-top-color: #aaa; }
            .search-section { display: none !important; }
            .logout-btn { display: none !important; }
            .user-role-badge { display: none !important; }
            .user-restriction-notice { display: none !important; }
            .date-filter-section { display: none !important; }
        }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .report-header h1 { font-size: 1.3rem; }
            .summary-cards { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
            .summary-item .value { font-size: 1.2rem; }
            .search-section { border-radius: 20px; padding: 0.7rem 1rem; }
            .search-input-wrapper { flex: 1 1 100%; }
            .add-form .form-group { flex: 1 1 100%; }
            .login-box { padding: 2rem 1.5rem; }
            .login-box .login-options { flex-direction: column; }
            .date-filter-section { border-radius: 20px; padding: 0.7rem 1rem; }
            .date-filter-section input[type="date"] { flex: 1 1 100%; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN OVERLAY ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="login-icon">🔐</div>
            <h2>KIWI · Tax Invoice System</h2>
            <p class="subtitle">Enter your credentials to continue</p>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Enter username" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password" />
            </div>
            <div class="login-options">
                <button class="login-btn" id="adminLoginBtn">👑 Admin</button>
                <button class="login-btn login-btn-user" id="userLoginBtn">👤 User</button>
            </div>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container hidden" id="mainContainer">
        <div id="appContent"></div>
    </div>

    <!-- Firebase (compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================
        const firebaseConfig = {
          apiKey: "AIzaSyB_PNwNGs-HG98BPVdtOUeFmn9Yz9GbesA",
          authDomain: "kiwi-invoices.firebaseapp.com",
          databaseURL: "https://kiwi-invoices-default-rtdb.firebaseio.com",
          projectId: "kiwi-invoices",
          storageBucket: "kiwi-invoices.firebasestorage.app",
          messagingSenderId: "437707889870",
          appId: "1:437707889870:web:1170810ecbb429a0a3849f",
          measurementId: "G-R9XSRWG91C"
        };
        firebase.initializeApp(firebaseConfig);
        const fbDb = firebase.database();

        // ============================================================
        // LOGIN SYSTEM
        // ============================================================
        document.getElementById('adminLoginBtn').onclick = function() { loginUser('admin'); };
        document.getElementById('userLoginBtn').onclick = function() { loginUser('user'); };
        document.getElementById('loginPass').onkeydown = function(e) { if (e.key === 'Enter') attemptLogin(); };
        document.getElementById('loginUser').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('loginPass').focus(); };

        function attemptLogin() {
            var username = document.getElementById('loginUser').value.trim();
            var password = document.getElementById('loginPass').value.trim();
            var errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '⚠️ Please enter both username and password.';
                return;
            }

            if (username === 'admin' && password === 'admin123') {
                loginUser('admin');
            } else if (username === 'user' && password === 'user123') {
                loginUser('user');
            } else {
                errorEl.textContent = '❌ Invalid username or password.';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginPass').focus();
            }
        }

        function loginUser(role) {
            var username = document.getElementById('loginUser').value.trim();
            var password = document.getElementById('loginPass').value.trim();
            var errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            if (!username || !password) {
                errorEl.textContent = '⚠️ Please enter both username and password.';
                return;
            }

            if (role === 'admin' && username === 'admin' && password === 'admin123') {
                saveLoginSession('admin');
                showApp('admin');
            } else if (role === 'user' && username === 'user' && password === 'user123') {
                saveLoginSession('user');
                showApp('user');
            } else {
                errorEl.textContent = '❌ Invalid credentials. Check and try again.';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginPass').focus();
            }
        }

        function showApp(role) {
            document.getElementById('loginOverlay').className = 'login-overlay hidden';
            document.getElementById('mainContainer').className = 'container';

            // Fetch data from Firebase first, then render UI
            refreshDataFromCloud(function() {
                var isAdmin = (role === 'admin');
                var appHtml = buildAppHTML(isAdmin);
                document.getElementById('appContent').innerHTML = appHtml;
                initApp(isAdmin);
            });
        }

        // ============================================================
        // DATA FETCHING & SAVING (FIREBASE)
        // ============================================================
        function refreshDataFromStorage() {
            fullData = loadSavedData();
            try {
                var savedParties = JSON.parse(localStorage.getItem(PARTY_STORAGE_KEY) || '{}');
                if (savedParties && typeof savedParties === 'object') {
                    Object.keys(savedParties).forEach(function(id) {
                        if (id) partyDatabase[id] = savedParties[id];
                    });
                }
            } catch (e) {}
        }

        function refreshDataFromCloud(callback) {
            refreshDataFromStorage();

            fbDb.ref('kiwi_data').once('value')
                .then(function(snapshot) {
                    var remote = snapshot.val();
                    if (remote) {
                        if (Array.isArray(remote.invoices)) fullData = remote.invoices;
                        if (remote.parties && typeof remote.parties === 'object') {
                            Object.keys(remote.parties).forEach(function(id) {
                                if (id) partyDatabase[id] = remote.parties[id];
                            });
                        }
                        // Update local storage cache
                        try {
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(fullData));
                            localStorage.setItem(PARTY_STORAGE_KEY, JSON.stringify(partyDatabase));
                        } catch (e) {}
                    }
                    callback();
                })
                .catch(function(err) {
                    console.warn('Firebase Fetch Error:', err);
                    callback(); // Use local data if offline
                });
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(fullData));
                localStorage.setItem(PARTY_STORAGE_KEY, JSON.stringify(partyDatabase));
            } catch (e) {
                alert('⚠️ Browser storage is blocked.');
                return false;
            }
            
            // Sync strictly to Firebase
            syncToFirebase();
            return true;
        }

        function syncToFirebase() {
            fbDb.ref('kiwi_data').set({
                invoices: fullData,
                parties: partyDatabase,
                savedAt: new Date().toISOString()
            }).then(function() {
                console.log('✅ Firebase sync successful!');
                var text = document.getElementById('fileSyncText');
                if (text) {
                    text.textContent = '✅ Synced to Firebase Cloud — every change saves here automatically.';
                }
            }).catch(function(err) {
                console.error('❌ Firebase sync FAILED:', err);
                alert('⚠️ Firebase Error: Could not save data to the cloud!\nCheck your internet connection or Firebase Rules.');
            });
        }

        // Backup Download Feature (JSON)
        function downloadBackup() {
            var payload = {
                savedAt: new Date().toISOString(),
                invoices: fullData,
                parties: partyDatabase
            };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            var stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = 'kiwi_tax_invoice_backup_' + stamp + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // DATA STORAGE KEYS & INITIAL DATA
        // ============================================================
        var STORAGE_KEY = 'kiwi_tax_invoice_data_v4';
        var PARTY_STORAGE_KEY = 'kiwi_party_database_v4';
        var LOGIN_STORAGE_KEY = 'kiwi_tax_invoice_login_v1';

        var partyDatabase = {
            '22034': { name: 'IDEAL SUPER MALL BOSAN ROAD', ntrn: '5527785-3', strn: '327787619200-4' },
            '22038': { name: 'LATIF S/S GULGASHT', ntrn: '4302495-5', strn: '312016393391-5' },
            '22033': { name: 'IDEAL MALL CHUNGI#6', ntrn: '7582544-8', strn: '327787614826-4' },
            '23129': { name: 'FRESHCO SWEETS & BAKERS BOSAN ROAD', ntrn: '', strn: '' },
            '22369': { name: 'TREND STORE GULGASHT', ntrn: '1309897-7', strn: '40013098971-9' },
            '22110': { name: 'FIYAZ MART BOSAN ROAD', ntrn: '1749512-1', strn: '327787618368-2' },
            '22056': { name: 'KK MART BOSAN ROAD', ntrn: '7197572-2', strn: '327787616144-3' },

        var fullData = loadSavedData();
        var isAdmin = false;

        function loadSavedData() {
            try {
                var saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    var parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (e) {}
            return JSON.parse(JSON.stringify(initialData));
        }

        function saveLoginSession(role) {
            try { localStorage.setItem(LOGIN_STORAGE_KEY, JSON.stringify({ role: role, savedAt: new Date().getTime() })); } catch (e) {}
        }

        function getLoginSession() {
            try {
                var saved = localStorage.getItem(LOGIN_STORAGE_KEY);
                if (!saved) return null;
                var session = JSON.parse(saved);
                if (session && (session.role === 'admin' || session.role === 'user')) return session.role;
            } catch (e) {}
            return null;
        }

        function clearLoginSession() {
            try { localStorage.removeItem(LOGIN_STORAGE_KEY); } catch (e) {}
        }

        // ============================================================
        // APP UI BUILDER & LOGIC
        // ============================================================
        function buildAppHTML(isAdmin) {
            var roleBadge = isAdmin ? '👑 Admin' : '👤 User';
            var roleClass = isAdmin ? '' : 'user';
            var noticeClass = isAdmin ? '' : 'visible';
            var resetDisplay = isAdmin ? 'inline-flex' : 'none';

            return `
                <div class="report-header">
                    <h1>🍯 KIWI · ADVANCE TAX INVOICE</h1>
                    <div class="header-actions">
                        <span class="month-badge" id="monthBadge">📅 FETCHING...</span>
                        <span class="user-role-badge ${roleClass}">${roleBadge}</span>
                        <button class="btn" id="downloadBackupBtn">⬇️ Download Backup</button>
                        <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
                        <button class="logout-btn" onclick="doLogout()">🚪 Logout</button>
                    </div>
                </div>

                <div class="file-sync-status" id="fileSyncStatus">
                    <span class="dot"></span>
                    <span id="fileSyncText">⏳ Connecting to Firebase Database...</span>

                <div class="add-form" id="addForm">
                    <div class="form-group">
                        <label>Party ID</label>
                        <input type="text" id="newPartyId" placeholder="e.g. 22034" />
                        <div class="auto-hint" id="idHint"></div>
                    </div>
                    <div class="form-group">
                        <label>Party Name</label>
                        <input type="text" id="newParty" placeholder="Auto-filled" ${!isAdmin ? 'readonly' : ''} class="${!isAdmin ? 'readonly-field' : ''}" />
                        <div class="auto-hint" id="autoHint"></div>
                    </div>
                    <div class="form-group">
                        <label>NTRN</label>
                        <input type="text" id="newNtrn" placeholder="Auto-filled" ${!isAdmin ? 'readonly' : ''} class="${!isAdmin ? 'readonly-field' : ''}" />
                    </div>
                    <div class="form-group">
                        <label>STRN</label>
                        <input type="text" id="newStrn" placeholder="Auto-filled" ${!isAdmin ? 'readonly' : ''} class="${!isAdmin ? 'readonly-field' : ''}" />
                    </div>
                    <div class="form-group">
                        <label>Invoice #</label>
                        <input type="text" id="newInv" placeholder="999999" />
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="newDate" />
                    </div>
                    <div class="form-group">
                        <label>Advance Tax</label>
                        <input type="number" id="newTax" placeholder="0" step="1" />
                    </div>
                    <div class="form-group">
                        <label>EX VALUE</label>
                        <input type="number" id="newEx" placeholder="0.00" step="0.01" />
                    </div>
                    <div class="form-group">
                        <label>TOTAL SALE</label>
                        <input type="number" id="newSale" placeholder="0" step="1" />
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-success" id="addEntryBtn">➕ Add</button>
                        <button class="btn btn-danger" id="resetDataBtn" style="display:${resetDisplay}">↺ Reset</button>
                    </div>
                </div>

                <div class="date-filter-section" id="dateFilterSection">
                    <label>📅 Date Range</label>
                    <input type="date" id="dateFrom" />
                    <span class="date-range-sep">to</span>
                    <input type="date" id="dateTo" />
                    <button class="btn-filter" id="applyDateFilter">Apply</button>
                    <button class="btn-clear-date" id="clearDateFilter">✕ Clear</button>
                    <span class="result-count" id="dateFilterCount"></span>
                </div>

                <div class="search-section" id="searchSection">
                    <label for="partySearch">🔍 Party</label>
                    <div class="search-input-wrapper">
                        <input type="text" id="partySearch" placeholder="Type party name or ID...">
                        <button id="searchBtn">Search</button>
                        <button class="search-clear" id="clearSearch">✕</button>
                    </div>
                    <span class="result-count" id="resultCount">0 entries</span>
                </div>

                <div class="summary-cards" id="summaryCards">
                    <div class="summary-item"><span class="label">🧾 Total invoices</span><span class="value" id="totalInvoices">0</span></div>
                    <div class="summary-item"><span class="label">💰 Advance Tax</span><span class="value" id="totalTax">0</span></div>
                    <div class="summary-item"><span class="label">📊 EX VALUE</span><span class="value" id="totalExValue">0</span></div>
                    <div class="summary-item"><span class="label">💵 TOTAL SALE</span><span class="value" id="totalSale">0</span></div>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Party ID</th>
                                <th>Party Name</th>
                                <th>NTRN</th>
                                <th>STRN</th>
                                <th>Invoice #</th>
                                <th>Date</th>
                                <th class="text-right">Advance Tax</th>
                                <th class="text-right">EX VALUE</th>
                                <th class="text-right">TOTAL SALE</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody"></tbody>
                    </table>
                </div>

                <div class="footer-note">
                    <span>📌 Non‑zero entries · <span id="footerMonthLabel">Loading...</span></span>
                    <span>⏱️ report generated · <span id="reportGeneratedDate">Loading...</span></span>
                </div>
                <div class="footer-credits">
                    <span>Report generated by: Hammad Sales Agency Multan</span>
                    <span>Designed by: Malik Mubashir Khokhar</span>
                </div>
            `;
        }

        // Auto-updating Dates
        var MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
        var MONTH_NAMES_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        function updateHeaderDates(today) {
            today = today || new Date();
            var badge = document.getElementById('monthBadge');
            if (badge) badge.textContent = '📅 ' + MONTH_NAMES[today.getMonth()] + ' ' + today.getFullYear();
            var genDate = document.getElementById('reportGeneratedDate');
            if (genDate) genDate.textContent = today.getDate() + ' ' + MONTH_NAMES_SHORT[today.getMonth()] + ' ' + today.getFullYear();
            var footerMonth = document.getElementById('footerMonthLabel');
            if (footerMonth) {
                var monthName = MONTH_NAMES[today.getMonth()];
                var properCase = monthName.charAt(0) + monthName.slice(1).toLowerCase();
                footerMonth.textContent = properCase + ' ' + today.getFullYear();
            }
        }

        function initApp(admin) {
            isAdmin = admin;
            document.getElementById('downloadBackupBtn').onclick = downloadBackup;

            var tbody = document.getElementById('invoiceTableBody');
            var searchInput = document.getElementById('partySearch');
            var searchBtn = document.getElementById('searchBtn');
            var clearBtn = document.getElementById('clearSearch');
            var resultCount = document.getElementById('resultCount');

            var dateFrom = document.getElementById('dateFrom');
            var dateTo = document.getElementById('dateTo');
            var applyDateFilter = document.getElementById('applyDateFilter');
            var clearDateFilterBtn = document.getElementById('clearDateFilter');
            var dateFilterCount = document.getElementById('dateFilterCount');

            var totalInvEl = document.getElementById('totalInvoices');
            var totalTaxEl = document.getElementById('totalTax');
            var totalExEl = document.getElementById('totalExValue');
            var totalSaleEl = document.getElementById('totalSale');

            var newPartyId = document.getElementById('newPartyId');
            var newParty = document.getElementById('newParty');
            var newNtrn = document.getElementById('newNtrn');
            var newStrn = document.getElementById('newStrn');
            var newInv = document.getElementById('newInv');
            var newDate = document.getElementById('newDate');
            var newTax = document.getElementById('newTax');
            var newEx = document.getElementById('newEx');
            var newSale = document.getElementById('newSale');
            var addBtn = document.getElementById('addEntryBtn');
            var resetBtn = document.getElementById('resetDataBtn');
            var autoHint = document.getElementById('autoHint');
            var idHint = document.getElementById('idHint');

            function formatNumber(n) { return n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
            function formatCurrency(n) { return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

            function computeTotals(data) {
                var inv = data.length, tax = 0, ex = 0, sale = 0;
                data.forEach(function(r) { tax += r.tax; ex += r.ex; sale += r.sale; });
                return { inv: inv, tax: tax, ex: ex, sale: sale };
            }

            function findPartyByPartyId(partyId) {
                var trimmed = partyId.trim();
                if (!trimmed) return null;
                return partyDatabase[trimmed] || null;
            }

            function handlePartyIdAutoFill() {
                var idVal = newPartyId.value.trim();
                newParty.classList.remove('auto-filled');
                newNtrn.classList.remove('auto-filled');
                newStrn.classList.remove('auto-filled');

                if (!idVal) {
                    idHint.textContent = ''; autoHint.textContent = '';
                    newParty.value = ''; newNtrn.value = ''; newStrn.value = '';
                    setPartyFieldsEditable(true);
                    return;
                }

                var details = findPartyByPartyId(idVal);
                if (details) {
                    newParty.value = details.name || '';
                    newNtrn.value = details.ntrn || '';
                    newStrn.value = details.strn || '';
                    idHint.textContent = '✅ Party found'; idHint.style.color = '#0f7b3e';
                    autoHint.textContent = '✅ Auto-filled'; autoHint.style.color = '#0f7b3e';
                    newParty.classList.add('auto-filled'); newNtrn.classList.add('auto-filled'); newStrn.classList.add('auto-filled');
                    setPartyFieldsEditable(isAdmin);
                } else {
                    idHint.textContent = '➕ New Party ID — enter details'; idHint.style.color = '#0b2b3f';
                    autoHint.textContent = '✏️ New party: Editable'; autoHint.style.color = '#0b2b3f';
                    setPartyFieldsEditable(true);
                }
            }

            function setPartyFieldsEditable(editable) {
                newParty.readOnly = !editable; newNtrn.readOnly = !editable; newStrn.readOnly = !editable;
                if (editable) {
                    newParty.classList.remove('readonly-field'); newNtrn.classList.remove('readonly-field'); newStrn.classList.remove('readonly-field');
                } else if (!isAdmin) {
                    newParty.classList.add('readonly-field'); newNtrn.classList.add('readonly-field'); newStrn.classList.add('readonly-field');
                }
            }

            function applyFilters() {
                var filtered = fullData.slice();
                var fromDate = dateFrom.value;
                var toDate = dateTo.value;
                
                if (fromDate && toDate) filtered = filtered.filter(function(row) { return row.date >= fromDate && row.date <= toDate; });
                else if (fromDate) filtered = filtered.filter(function(row) { return row.date >= fromDate; });
                else if (toDate) filtered = filtered.filter(function(row) { return row.date <= toDate; });
                
                var searchTerm = searchInput.value.trim().toUpperCase();
                if (searchTerm) {
                    filtered = filtered.filter(function(row) {
                        return row.party.toUpperCase().includes(searchTerm) || (row.partyId && row.partyId.includes(searchTerm));
                    });
                }
                
                renderTable(filtered);
                updateSummary(filtered);
                
                if (fromDate || toDate) dateFilterCount.textContent = '📅 ' + filtered.length + ' entries in range';
                else dateFilterCount.textContent = '';
            }

            function clearDateFilter() {
                dateFrom.value = ''; dateTo.value = ''; dateFilterCount.textContent = '';
                applyFilters();
            }

            function renderTable(data) {
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">No entries found</td></tr>';
                    return;
                }

                var html = '';
                data.forEach(function(row) {
                    var dateFormatted = row.date ? row.date.replace(/-/g, '/') : '—';
                    var dataIndex = fullData.findIndex(function(d) { return d.party === row.party && d.inv === row.inv && d.date === row.date; });
                    var deleteIdx = dataIndex !== -1 ? dataIndex : 0;
                    
                    var deleteButton = isAdmin 
                        ? '<button class="btn-danger-small" onclick="deleteEntry(' + deleteIdx + ')">Delete</button>'
                        : '<button class="btn-danger-small disabled" onclick="alert(\'⚠️ User cannot delete\')">Delete</button>';
                    
                    html += '<tr>' +
                        '<td>' + (row.partyId || '—') + '</td>' +
                        '<td class="party-name">' + row.party + '</td>' +
                        '<td>' + (row.ntrn || '—') + '</td>' +
                        '<td>' + (row.strn || '—') + '</td>' +
                        '<td>' + row.inv + '</td>' +
                        '<td>' + dateFormatted + '</td>' +
                        '<td class="text-right">' + formatNumber(row.tax) + '</td>' +
                        '<td class="text-right">' + formatCurrency(row.ex) + '</td>' +
                        '<td class="text-right">' + formatNumber(row.sale) + '</td>' +
                        '<td class="delete-cell">' + deleteButton + '</td>' +
                    '</tr>';
                });
                tbody.innerHTML = html;
            }

            function updateSummary(data) {
                var totals = computeTotals(data);
                totalInvEl.textContent = totals.inv;
                totalTaxEl.textContent = formatNumber(totals.tax);
                totalExEl.textContent = formatCurrency(totals.ex);
                totalSaleEl.textContent = formatNumber(totals.sale);
                resultCount.textContent = data.length + ' entries';
            }

            window.deleteEntry = function(index) {
                if (!isAdmin) return alert('⚠️ User cannot delete entries.');
                if (index >= 0 && index < fullData.length) {
                    if (confirm('Delete this entry?')) {
                        fullData.splice(index, 1);
                        saveData(); // Saves & Syncs to Firebase
                        applyFilters();
                    }
                }
            };

            function resetData() {
                if (!isAdmin) return alert('⚠️ User cannot reset data.');
                if (confirm('Reset all data?')) {
                    fullData = JSON.parse(JSON.stringify(initialData));
                    localStorage.removeItem(STORAGE_KEY);
                    searchInput.value = '';
                    clearDateFilter();
                    newPartyId.value = ''; newParty.value = ''; newNtrn.value = ''; newStrn.value = ''; newInv.value = ''; newTax.value = ''; newEx.value = ''; newSale.value = '';
                    autoHint.textContent = ''; idHint.textContent = '';
                    saveData(); // Saves & Syncs to Firebase
                    applyFilters();
                }
            }

            function addEntry() {
                var partyId = newPartyId.value.trim();
                var party = newParty.value.trim();
                var ntrn = newNtrn.value.trim();
                var strn = newStrn.value.trim();
                var inv = newInv.value.trim();
                var date = newDate.value;
                var tax = parseFloat(newTax.value);
                var ex = parseFloat(newEx.value);
                var sale = parseFloat(newSale.value);

                if (!partyId || !party || !inv || !date || isNaN(tax) || isNaN(ex) || isNaN(sale)) {
                    alert('⚠️ Please fill all required fields.'); return;
                }

                var duplicate = fullData.find(function(r) { return String(r.inv).trim().toUpperCase() === inv.toUpperCase(); });
                if (duplicate) {
                    alert('⚠️ THIS INVOICE ALREADY EXISTS!\n\nInvoice #: ' + inv + '\nParty: ' + duplicate.party);
                    newInv.focus(); return;
                }

                var newRecord = { partyId: partyId, party: party, ntrn: ntrn, strn: strn, inv: inv, date: date, tax: tax, ex: ex, sale: sale };
                fullData.push(newRecord);

                // Register new party if not existing
                if (!partyDatabase[partyId]) {
                    partyDatabase[partyId] = { name: party, ntrn: ntrn, strn: strn };
                }
                
                saveData(); // Saves & Syncs to Firebase

                searchInput.value = '';
                if (dateFrom.value && dateTo.value && (date < dateFrom.value || date > dateTo.value)) {
                    dateFrom.value = ''; dateTo.value = ''; dateFilterCount.textContent = '';
                }

                newPartyId.value = ''; newParty.value = ''; newNtrn.value = ''; newStrn.value = ''; newInv.value = ''; newTax.value = ''; newEx.value = ''; newSale.value = '';
                autoHint.textContent = ''; idHint.textContent = '';
                setPartyFieldsEditable(true);

                applyFilters();
            }

            // Init Dates
            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            newDate.value = yyyy + '-' + mm + '-' + dd;

            var lastDay = new Date(yyyy, today.getMonth() + 1, 0).getDate();
            dateFrom.value = yyyy + '-' + mm + '-01';
            dateTo.value = yyyy + '-' + mm + '-' + String(lastDay).padStart(2, '0');

            updateHeaderDates(today);

            addBtn.onclick = addEntry;
            if (resetBtn) resetBtn.onclick = resetData;
            newPartyId.oninput = handlePartyIdAutoFill;
            
            searchBtn.onclick = applyFilters;
            searchInput.onkeydown = function(e) { if (e.key === 'Enter') applyFilters(); };
            clearBtn.onclick = function() { searchInput.value = ''; applyFilters(); };
            applyDateFilter.onclick = applyFilters;
            clearDateFilterBtn.onclick = clearDateFilter;
            dateFrom.onkeydown = function(e) { if (e.key === 'Enter') applyFilters(); };
            dateTo.onkeydown = function(e) { if (e.key === 'Enter') applyFilters(); };

            applyFilters();
        }

        function doLogout() {
            if (confirm('Logout?')) {
                clearLoginSession();
                document.getElementById('mainContainer').className = 'container hidden';
                document.getElementById('loginOverlay').className = 'login-overlay';
                document.getElementById('loginUser').value = '';
                document.getElementById('loginPass').value = '';
                document.getElementById('loginError').textContent = '';
                document.getElementById('appContent').innerHTML = '';
                document.getElementById('loginUser').focus();
            }
        }

        // Auto-restore session
        (function restoreLoginAfterRefresh() {
            var savedRole = getLoginSession();
            if (savedRole) {
                showApp(savedRole);
            } else {
                document.getElementById('loginUser').focus();
            }
        })();

        // Refresh data if user switches tabs
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState !== 'visible') return;
            var container = document.getElementById('mainContainer');
            if (!container || container.className.indexOf('hidden') !== -1) return;
            refreshDataFromCloud(function() { initApp(isAdmin); });
        });

    </script>
</body>
